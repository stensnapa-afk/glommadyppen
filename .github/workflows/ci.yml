# Auto-generert CI-gate (build + test) — fanger type/test-regresjoner paa push/PR.
# Blokkerer ikke deploy; Vercel/CF deployer uavhengig. Generator: scripts-gen-ci.
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      SKIP_ENV_VALIDATION: "1"
      # Dummy build-tids-verdier: moduler validerer ofte env ved last (iron-session krever
      # SESSION_SECRET>=32, DB-klienter krever DATABASE_URL satt). Build kobler/bruker dem ikke
      # reelt; dette er trygge placeholdere saa page-data-innsamling ikke faller paa "env not set".
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SESSION_SECRET: "ci-dummy-session-secret-0123456789abcdef"
      ANTHROPIC_API_KEY: "sk-ci-dummy"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
